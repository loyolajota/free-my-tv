name: build
on: workflow_dispatch
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compilar
        env:
          TMDB: ${{ secrets.TMDB_KEY }}
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" "platforms;android-34"
          chmod +x build.sh
          ./build.sh || true
          sed -i "s|^tmdb_key=.*|tmdb_key=$TMDB|; s|^tmdb_region=.*|tmdb_region=BR|; s|^latitude=.*|latitude=-22.9858|; s|^longitude=.*|longitude=-43.2490|; s|^city=.*|city=Rio de Janeiro|" config.properties
          ./build.sh
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk -y --cleanup-tag || true
          gh release create apk FreeMyTV.apk --title FreeMyTV --notes apk
